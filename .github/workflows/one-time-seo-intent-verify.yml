name: One-time SEO intent verification

on:
  push:
    branches:
      - integrated-mvp
    paths:
      - .github/workflows/one-time-seo-intent-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrated-mvp
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Confirm updated pages
        run: |
          grep -q "墓石・リフォーム・墓じまい" dist/sekizaiten/index.html
          grep -q "区画の確認方法" dist/access/index.html
