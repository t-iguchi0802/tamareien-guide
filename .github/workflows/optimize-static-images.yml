name: Optimize static images

on:
  push:
    branches:
      - integrated-mvp
    paths:
      - .github/workflows/optimize-static-images.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: integrated-mvp

      - name: Install WebP encoder
        run: |
          sudo apt-get update -y
          sudo apt-get install -y webp

      - name: Convert large PNG photos to WebP
        run: |
          set -e
          cwebp -quiet -mt -q 82 public/images/hero-cemetery-photo-v2.png -o public/images/hero-cemetery-photo-v2.webp
          cwebp -quiet -mt -q 82 public/images/hero-cemetery-v1.png -o public/images/hero-cemetery-v1.webp
          cwebp -quiet -mt -q 80 public/images/sponsors/mitaka-anshin-soudan-v1.png -o public/images/sponsors/mitaka-anshin-soudan-v1.webp
          ls -lh public/images/hero-cemetery-photo-v2.* public/images/hero-cemetery-v1.* public/images/sponsors/mitaka-anshin-soudan-v1.*

      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/hero-cemetery-photo-v2.webp public/images/hero-cemetery-v1.webp public/images/sponsors/mitaka-anshin-soudan-v1.webp
          if git diff --cached --quiet; then
            echo "No image changes"
            exit 0
          fi
          git commit -m "perf: add optimized WebP image assets"
          git push origin HEAD:integrated-mvp
