name: One-time final mobile and sponsor polish

on:
  push:
    branches:
      - integrated-mvp
    paths:
      - .github/workflows/one-time-final-mobile-sponsor.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrated-mvp

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply final UI changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'marker not found in {path}: {old[:80]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # TOP: broad cemetery guide first; stone-shop count stays on the comparison page.
          replace(
              'src/pages/index.astro',
              "const pageTitle = `多磨霊園の石材店${businesses.length}社を比較｜墓じまい・管理・墓参りガイド`;\nconst description =\n  `多磨霊園周辺の石材店${businesses.length}社を、墓石建立・墓じまい・清掃管理など目的別に比較。アクセス、著名人墓所、季節の墓参り情報も掲載する地域ガイドです。`;",
              "const pageTitle = '多磨霊園 お墓ガイド｜墓じまい・石材店・アクセス・供養';\nconst description =\n  '多磨霊園のお墓・供養に関する地域ガイド。墓じまい、石材店比較、アクセス、みたま堂、樹木葬・合葬、募集・費用などを目的から探せます。';"
          )
          replace(
              'src/pages/index.astro',
              '''        <p class="hero__eyebrow">多磨霊園周辺・{businesses.length}社掲載</p>\n        <h1 id="hero-heading" class="hero__heading">\n          <span class="hero__heading-line">多磨霊園の石材店・お墓を</span>\n          <span class="hero__heading-line">目的から探す</span>\n        </h1>\n        <p class="hero__lead">\n          墓石を建てる、直す、墓じまい、清掃・管理。必要なことから相談先を探せます。\n        </p>\n        <a class="hero__cta" href={ROUTES.sekizaiten.path}>\n          {businesses.length}社の一覧を見る\n          <span aria-hidden="true">→</span>\n        </a>''',
              '''        <p class="hero__eyebrow">多磨霊園のお墓・供養ガイド</p>\n        <h1 id="hero-heading" class="hero__heading">\n          <span class="hero__heading-line">多磨霊園のお墓・供養を</span>\n          <span class="hero__heading-line">目的から探す</span>\n        </h1>\n        <p class="hero__lead">\n          お墓を建てる・整える、墓じまい・改葬、管理・清掃・供養。必要なことから情報や相談先を探せます。\n        </p>\n        <a class="hero__cta" href="#service-filter-heading">\n          目的から探す\n          <span aria-hidden="true">↓</span>\n        </a>'''
          )

          # Stone-shop cards: main sponsor uses two columns on desktop and a richer card on mobile.
          replace(
              'src/components/business/BusinessCard.astro',
              '  class="business-card"',
              "  class:list={['business-card', { 'business-card--sponsored': isSponsored }]}"
          )
          replace(
              'src/components/business/BusinessCard.astro',
              '    <p class="business-card__sponsor-badge" data-sponsor-result-badge hidden>PR｜メインスポンサー</p>',
              '''    {\n      isSponsored && (\n        <p class="business-card__sponsor-badge" data-sponsor-result-badge>PR｜メインスポンサー</p>\n      )\n    }'''
          )
          replace(
              'src/components/business/BusinessCard.astro',
              '''  <footer class="business-card__actions">''',
              '''  {\n    isSponsored && business.summary && (\n      <p class="business-card__sponsor-summary">{business.summary}</p>\n    )\n  }\n\n  <footer class="business-card__actions">'''
          )
          replace(
              'src/components/business/BusinessCard.astro',
              '''  .business-card[hidden] {\n    display: none;\n  }''',
              '''  .business-card[hidden] {\n    display: none;\n  }\n\n  .business-card--sponsored {\n    grid-column: 1 / -1;\n    min-height: 250px;\n    padding: var(--space-6);\n    border: 2px solid var(--color-sponsor-border);\n    border-top-width: 4px;\n    background: linear-gradient(180deg, #fffdf7 0%, #fbf5e8 100%);\n    box-shadow: 0 8px 24px rgba(66, 55, 31, 0.09);\n  }'''
          )
          replace(
              'src/components/business/BusinessCard.astro',
              '''  .business-card__actions {\n    display: flex;''',
              '''  .business-card__sponsor-summary {\n    max-width: 48rem;\n    margin: 0;\n    color: var(--color-text);\n    font-size: var(--font-size-label);\n    line-height: 1.65;\n    display: -webkit-box;\n    -webkit-line-clamp: 2;\n    line-clamp: 2;\n    -webkit-box-orient: vertical;\n    overflow: hidden;\n  }\n\n  .business-card__actions {\n    display: flex;'''
          )
          replace(
              'src/components/business/BusinessCard.astro',
              '''    .business-card {\n      gap: 0.65rem;\n      padding: 0.9rem 1rem;\n    }''',
              '''    .business-card {\n      gap: 0.65rem;\n      padding: 0.9rem 1rem;\n    }\n\n    .business-card--sponsored {\n      grid-column: auto;\n      min-height: 0;\n      gap: 0.8rem;\n      padding: 1.15rem;\n      border-width: 2px;\n      border-top-width: 4px;\n    }'''
          )

          # PR label remains visible whenever a paid main-sponsor card is shown.
          replace(
              'src/components/business/ServiceFilter.astro',
              "            if (sponsorBadge) sponsorBadge.hidden = !(hasSelection && isSponsor);",
              "            if (sponsorBadge) sponsorBadge.hidden = !isSponsor;"
          )

          # Avoid a hard-coded 31 if the database changes later.
          replace(
              'src/pages/sekizaiten/index.astro',
              '<summary class="detail-table__summary">全31社・全12サービスの詳しい比較表を見る</summary>',
              '<summary class="detail-table__summary">全{businesses.length}社・全12サービスの詳しい比較表を見る</summary>'
          )

          # Keep a reusable one-click launcher inside the repository as well.
          Path('local-preview.bat').write_text(r'''@echo off\r\nchcp 65001 >nul\r\ncd /d "%~dp0"\r\necho [1/4] GitHubの最新版を取得しています...\r\ngit pull --ff-only\r\nif errorlevel 1 goto error\r\necho [2/4] 必要なパッケージを確認しています...\r\ncall npm install --no-audit --no-fund\r\nif errorlevel 1 goto error\r\necho [3/4] 本番用にビルドしています...\r\ncall npm run build\r\nif errorlevel 1 goto error\r\necho [4/4] ローカル確認画面を開きます...\r\nfor /f "tokens=5" %%P in ('netstat -ano ^| findstr ":4321" ^| findstr "LISTENING"') do taskkill /PID %%P /F >nul 2>&1\r\nstart "多磨霊園 ローカルプレビュー" cmd /k "cd /d \"%~dp0\" && npm run preview -- --host 127.0.0.1 --port 4321"\r\ntimeout /t 2 /nobreak >nul\r\nstart "" "http://localhost:4321/"\r\nexit /b 0\r\n:error\r\necho.\r\necho エラーが発生しました。この画面をスクリーンショットして送ってください。\r\npause\r\n''', encoding='utf-8')
          PY

      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: Verify output
        run: |
          grep -q "多磨霊園のお墓・供養を" dist/index.html
          grep -q "墓を建てる" dist/index.html
          grep -q "供花・墓参り代行" dist/index.html
          grep -q "掲載石材店" dist/sekizaiten/index.html
          grep -q "PR｜メインスポンサー" dist/sekizaiten/index.html

      - name: Commit polished UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/index.astro src/pages/sekizaiten/index.astro src/components/business/BusinessCard.astro src/components/business/ServiceFilter.astro local-preview.bat
          git commit -m "ui: finalize mobile comparison and sponsor differentiation"
          git push origin HEAD:integrated-mvp
