<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-labelledby="title desc">
  <title id="title">同じ2㎡の区画を同じ縮尺で比較</title>
  <desc id="desc">左は間口100cm・奥行き200cm。右は間口80cm・奥行き250cm。両方とも下側が入口側の仮想例です。</desc>
  <rect width="560" height="400" rx="16" fill="#f5f7f5"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#183c36">
    <text x="280" y="40" font-size="26" font-weight="700">同じ2㎡、異なる間口と奥行き</text>
    <text x="145" y="100" font-size="22" font-weight="700">区画 A</text>
    <text x="415" y="62" font-size="22" font-weight="700">区画 B</text>
    <rect x="95" y="125" width="100" height="200" fill="#d9e8de" stroke="#315d50" stroke-width="2"/>
    <rect x="375" y="75" width="80" height="250" fill="#d9e8de" stroke="#315d50" stroke-width="2"/>
    <path d="M205 125h12m-6 0v200m-6 0h12M465 75h12m-6 0v250m-6 0h12M95 334v10m0-5h100m0-5v10M375 334v10m0-5h80m0-5v10" stroke="#315d50" stroke-width="1.5" fill="none"/>
    <text x="254" y="231" font-size="19">200cm</text>
    <text x="514" y="206" font-size="19">250cm</text>
    <text x="145" y="369" font-size="20">入口側 100cm</text>
    <text x="415" y="369" font-size="20">入口側 80cm</text>
  </g>
</svg>
